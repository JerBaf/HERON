# Gompertz growth (regression / stable / progression), one regime per sequence; nodes split, so the topology changes. K = 3.
# Data: ../data/datasets/gompertz, written by data/src/generate.py (5000 windows, C = H = 5, 8 dynamic channels).
# Same as gompertz.yaml, with the example graph-recurrent backbone (examples/graph_gru.py) in place of the GRU
# entity transition: HERON plugged onto an existing architecture (heron/backbone.py). Run with PYTHONPATH=. (repo root).
data:
  root: ../data/datasets/gompertz
  context: 5
  horizon: 5
  batch_size: 256
model:
  num_regimes: 3
  backbone: {class: examples.graph_gru:GraphGRU, hops: 1}
out_dir: runs/gompertz_graphgru
